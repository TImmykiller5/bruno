info:
  name: get-price-by-id
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/prices/:stock_id?range=1m"
  params:
    - name: range
      value: 1m
      type: query
    - name: stock_id
      value: "21"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Search stocks endpoint
  # range:
  #   1d = 1 day
  #   1w = 1 week
  #   1m = 1 month

  params {
    range: "1d", "1w", "1m", "3m", "6m", "1y", "2y", "5y", "max"
  }
